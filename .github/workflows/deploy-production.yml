name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

  deploy:
    name: Deploy to Hostinger
    needs: verify
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy dist to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          local-dir: ./dist/
          log-level: minimal
          dangerous-clean-slate: false

      - name: Smoke test production
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://touatiayoub.com/ > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://touatiayoub.com/robots.txt > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://touatiayoub.com/sitemap.xml > /dev/null
